<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ task.title }} | Task Manager</title>
</head>
<body>
    <h1>{{ task.title }}</h1>

    <p>
        <strong>Description:</strong>
        {% if task.description %}
            {{ task.description }}
        {% else %}
            No description provided.
        {% endif %}
    </p>

    <p>
        <strong>Status:</strong> {{ task.status }}
    </p>

    <p>
        <strong>Due Date:</strong> {{ task.due_date }}
    </p>

    <p>
        <strong>Created At:</strong> {{ task.created_at|date:"d M Y, h:i A" }}
    </p>

    <hr>

    <a href="{% url 'task_update' task.pk %}">Edit Task</a>
    |
    <a href="{% url 'task_delete' task.pk %}">Delete Task</a>
    |
    <a href="{% url 'task_list' %}">Back to Home</a>
</body>
</html>
