{% extends 'tasks/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="hero-section">
    <div>
        <p class="eyebrow">TASK MANAGEMENT</p>
        <h1 class="hero-title">{{ title }}<span class="title-dot">.</span></h1>
        <p class="hero-date">Create or update your task details.</p>
    </div>
</div>

<div class="task-panel about-panel">
    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="button">Save Task</button>
        <a href="{% url 'task_list' %}" class="button">Cancel</a>
    </form>
</div>
{% endblock %}
